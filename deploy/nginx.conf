# Вариант для nginx, если он уже стоит на сервере. Сертификат получает certbot.
server {
    listen 443 ssl;
    server_name varaq.uz www.varaq.uz;

    # ssl_certificate и ssl_certificate_key допишет certbot: sudo certbot --nginx -d varaq.uz -d www.varaq.uz

    client_max_body_size 13m;   # админка присылает страницу целиком, с картинками проектов

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
