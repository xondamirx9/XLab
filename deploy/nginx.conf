# Вариант для nginx, если он уже стоит на сервере. Сертификат получает certbot.
server {
    listen 443 ssl;
    server_name codexlab.uz www.codexlab.uz;

    # ssl_certificate и ssl_certificate_key допишет certbot: sudo certbot --nginx -d codexlab.uz -d www.codexlab.uz

    client_max_body_size 13m;   # админка присылает страницу целиком, с картинками проектов

    # Браузер год открывает сайт только по HTTPS: подменить первый заход по http:// не получится.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
