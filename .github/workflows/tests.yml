# Автотесты на каждый push и PR — на настоящем PostgreSQL, как на сервере (README, «Проверки для разработчика»).
# Репозиторий публичный: журналы видят все, поэтому в проверках только придуманные данные, без ключей и паролей.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # PR из ветки этого же репозитория уже проверен по push — второй раз не гоняем; PR из чужой копии — проверяем
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18                   # та же версия, что на машине админки (deploy/uzcloud)
        env:
          POSTGRES_USER: codexlab
          POSTGRES_PASSWORD: codexlab        # только для этой временной базы проверок
          POSTGRES_DB: codexlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexlab -d codexlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://codexlab:codexlab@localhost:5432/codexlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Зависимости
        run: pip install -r requirements.txt
      - name: Проверки
        run: python -m unittest discover -s tests -v
      # Скрипты выкладки и workflow — до кнопки релиза, а не на машинах
      - name: Скрипты выкладки
        run: shellcheck deploy/uzcloud/*.sh
      - name: Workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      # Тот же образ, что уедет на машины (deploy/uzcloud): собирается и отвечает на /api/health
      - name: Образ Docker
        run: docker build -t codexlab:ci .
      - name: Образ запускается
        run: |
          docker run -d --name site --network host -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e HOST=127.0.0.1 -e PORT=8080 -e INDEXNOW=0 codexlab:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              docker stop site >/dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs site
          exit 1
